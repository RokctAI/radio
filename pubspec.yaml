name: single_radio
description: "Flutter Single Radio."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluentui_icons: ^1.0.0
  gap: ^3.0.1
  flutter_svg: ^2.0.14
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  sleek_circular_slider: ^2.0.1
  radio_player: ^1.7.0
  music_visualizer: ^1.0.4
  volume_regulator: ^2.4.0
  google_mobile_ads: ^5.2.0
  unity_ads_plugin: ^0.3.21
  facebook_audience_network: ^1.0.1
  flutter_slider_drawer: ^2.1.3
  text_scroll: ^0.2.0
  back_button_behavior: ^0.0.2
  url_launcher: ^6.3.1
  onesignal_flutter: ^5.2.7
  blur: ^4.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.2

flutter_native_splash:
  background_image: assets/images/splash.png
  android: true
  ios: true

  android_12:
    color: "#000000"
    color_dark: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: fonts/ClashDisplay-Bold.ttf
    - family: ClashGrotesk
      fonts:
        - asset: fonts/ClashGrotesk-Light.ttf
          weight: 300
        - asset: fonts/ClashGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/ClashGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/ClashGrotesk-Semibold.ttf
          weight: 600
        - asset: fonts/ClashGrotesk-Bold.ttf

