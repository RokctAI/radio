name: single_radio
description: "Flutter Single Radio."

publish_to: 'none'

version: 1.3.1+7

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.5'

dependencies:
  flutter:
    sdk: flutter

  # Shared kernel. The composer supplies this as a git dependency; a path
  # dependency is the local-development equivalent until this app composes.
  base_sdk:
    path: ../../../../RokctAI/core/base/dart

  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  # Versions matched to the fleet majority across the 29 SDK pubspecs.
  flutter_riverpod: ^2.5.1
  get_it: ^8.0.0
  auto_route: ^9.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1
  flutter_svg: ^2.0.14
  http: ^1.2.2
  shared_preferences: ^2.5.2
  sleek_circular_slider: ^2.0.1
  radio_player: ^1.7.0
  music_visualizer: ^1.0.4
  volume_regulator: ^2.4.0
  google_mobile_ads: ^5.2.0
  unity_ads_plugin: ^0.3.21
  facebook_audience_network: ^1.0.1
  flutter_slider_drawer: ^2.1.3
  text_scroll: ^0.2.0
  url_launcher: ^6.3.1
  onesignal_flutter: ^5.2.7
  blur: ^4.0.0
  connectivity_plus: ^6.1.0
  webview_flutter: ^4.0.7
  firebase_core: ^3.10.0
  firebase_remote_config: ^5.1.3
  remixicon: ^1.2.0
  package_info_plus: ^8.3.0
  # Imported by splash_screen.dart for FlutterNativeSplash.remove(), so it has
  # to be a real dependency, not just the dev-time generator.
  flutter_native_splash: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  auto_route_generator: ^9.3.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter_native_splash:
  background_image: assets/images/splash.png
  android: true
  ios: true

  android_12:
    color: "#000000"
    color_dark: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Bold.ttf
    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/ClashGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/ClashGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashGrotesk-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashGrotesk-Bold.ttf

