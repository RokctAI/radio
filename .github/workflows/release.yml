name: Auto Release (Weekly)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  # Never auto-cancel a release run: cancelling mid-publish can leave partial
  # releases (half-uploaded assets, dangling tags).
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"

      node-version:
        type: string
        default: '24'
      python-version:
        type: string
        default: '3.14'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '15'
      db-type:
        type: string
        default: 'mariadb'
      flutter-channel:
        type: string
        default: 'stable'
      java-version:
        type: string
        default: '17'
      version_format:
        type: string
        default: '##.##.##'
        description: "Format for version bumping (e.g. ##.##.## or ##.##.#)"

jobs:
  release:
    permissions: write-all
    uses: RokctAI/shared-workflows/.github/workflows/universal-pipeline.yml@18740da00c9d2806e2ba595d3d07db77d3c29155 # shared-workflows main (adds the Dynamic Source Rename stray-package prune to universal-release.yml)
    with:
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      project_type: 'flutter'
      # Must match build.yml's app-type and this shell's .rokct/config/app_type
      # marker ('radio'). This file was seeded as a byte-identical copy of
      # supacharge's release.yml, which carried supacharge's own 'customer'
      # value - leaving the dispatch release path composing under a different
      # app_type than the push path that actually builds this repo.
      app-type: 'radio'
      # Dogfooding: Use the new Weekly Strategy
      release_strategy: 'weekly'

      # RC Cleanup: Delete RC releases/tags after promotion to stable
      cleanup_rc_releases: true
      
      # One-time cleanup: Set a cutoff date (YYYY-MM-DD) to run cleanup once if past this date
      # After cleanup runs once, a marker file is created and cleanup won't run again
      # Example: one_time_cleanup_cutoff_date: '2026-02-01'
      one_time_cleanup_cutoff_date: '2026-01-30'
      
      # Brain Endpoint 
      brain_endpoint: https://platform.rokct.ai/api/v1/method/rokct.platform.api

      # Build APK
      build_android: true
      # Build Windows desktop app and attach it to releases (this repo's committed
      # windows/ runner is kept in sync by desktop_sdk at compose time)
      build_windows: true
      # Opt into Huawei Mobile Services wiring (hms_sdk in composer.json). Gracefully
      # skips to a GMS-only build until agconnect-services.json exists in Occultation.
      build_hms: true
      # Environment configuration
      node-version: ${{ inputs.node-version || '24' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '15' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: '3.44.9'
      java-version: ${{ inputs.java-version || '17' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
    secrets: inherit
